description: 'Excision BioTherapeutics is a clinical-stage biotechnology company developing CRISPR-based
  in vivo gene-editing therapies aimed at curing serious viral infectious diseases. Its programs apply
  multiplexed CRISPR editing delivered via AAV vectors to excise viral DNA from the host genome, led by
  EBT-101, an investigational one-time therapy for HIV. Excision is a therapeutics company with no public
  developer API, SDK, or documentation surface; this profile is maintained in the API Evangelist network
  as a venture-portfolio company record rather than an API producer.'
